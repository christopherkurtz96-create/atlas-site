# Netlify configuration for ATLAS Demolition & Site Work

[build]
  publish = "."

# Retire old privacy-policy URL — single canonical privacy page at /privacy
# now that A2P 10DLC compliance language lives there.
[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy"
  status = 301
  force = true

# Custom headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Form handling
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = false

